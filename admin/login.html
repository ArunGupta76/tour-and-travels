<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Wanderlust Control Panel</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  
  <!-- Shared Admin Common CSS -->
  <link rel="stylesheet" href="css/admin-common.css">
  <!-- Page Specific CSS -->
  <link rel="stylesheet" href="css/admin-login.css">
</head>
<body class="admin-login-body">

  <div class="admin-login-card">
    <div class="admin-login-header">
      <div class="admin-lock-icon">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h2 class="admin-login-title">Control Panel</h2>
      <p class="admin-login-desc">Enter authorized credentials to manage bookings, packages, offers, and content.</p>
    </div>

    <form id="adminLoginForm">
      <div class="mb-3">
        <label for="adminEmail" class="form-label small fw-bold">Admin Email Address *</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-user-shield text-muted"></i></span>
          <input type="email" id="adminEmail" class="form-control border-start-0" placeholder="admin@wanderlust.com" required value="admin@wanderlust.com">
        </div>
      </div>

      <div class="mb-4">
        <label for="adminPassword" class="form-label small fw-bold">Admin Password *</label>
        <div class="position-relative">
          <input type="password" id="adminPassword" class="form-control pe-5" placeholder="Enter administrator password" required value="Admin@12345">
          <button type="button" id="toggleAdminPass" class="btn btn-link position-absolute end-0 top-50 translate-middle-y text-muted text-decoration-none pe-3" aria-label="Toggle password">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="adminLoginSubmitBtn" class="btn btn-primary w-100 py-3 fw-bold shadow-sm mb-3" style="background: linear-gradient(135deg, #0284C7, #0369A1); border: none;">
        <i class="fa-solid fa-right-to-bracket me-2"></i> Access Admin Console
      </button>

      <div class="text-center mt-3 pt-3 border-top">
        <a href="../index.html" class="text-muted small text-decoration-none">
          <i class="fa-solid fa-arrow-left me-1"></i> Back to Public Website
        </a>
      </div>
    </form>
  </div>

  <!-- Admin Toast Container -->
  <div id="adminToastContainer"></div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Shared Admin JS -->
  <script src="js/admin-common.js"></script>
  <!-- Page Specific JS -->
  <script src="js/admin-login.js"></script>
</body>
</html>
